<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Excess Green image-processing pipeline</title>
<desc id="desc">A conceptual workflow from input crop image through ExG, median filtering, Otsu thresholding, morphology and connected candidate regions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102a20"/><stop offset="1" stop-color="#1b4935"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#9ed7b4" stroke-width="1.4"/></marker>
</defs>
<rect width="1200" height="270" rx="22" fill="url(#bg)"/>
<text x="42" y="42" fill="#b9e8c8" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">IMAGE PROCESSING PIPELINE</text>
<text x="42" y="70" fill="#ffffff" font-family="Arial,sans-serif" font-size="13">Conceptual stages used by the separate improved implementation</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g><rect x="35" y="112" width="150" height="92" rx="13" fill="#e8f5ec"/><text x="110" y="150" fill="#173c2a" font-size="16" font-weight="700">Input image</text><text x="110" y="174" fill="#436b54" font-size="12">RGB field photo</text></g>
  <g><rect x="220" y="112" width="150" height="92" rx="13" fill="#d6efdf"/><text x="295" y="150" fill="#173c2a" font-size="16" font-weight="700">ExG index</text><text x="295" y="174" fill="#436b54" font-size="12">2G − R − B</text></g>
  <g><rect x="405" y="112" width="150" height="92" rx="13" fill="#e8f5ec"/><text x="480" y="150" fill="#173c2a" font-size="16" font-weight="700">Median filter</text><text x="480" y="174" fill="#436b54" font-size="12">3 × 3 neighbourhood</text></g>
  <g><rect x="590" y="112" width="150" height="92" rx="13" fill="#d6efdf"/><text x="665" y="150" fill="#173c2a" font-size="16" font-weight="700">Otsu threshold</text><text x="665" y="174" fill="#436b54" font-size="12">Binary mask</text></g>
  <g><rect x="775" y="112" width="150" height="92" rx="13" fill="#e8f5ec"/><text x="850" y="150" fill="#173c2a" font-size="16" font-weight="700">Morphology</text><text x="850" y="174" fill="#436b54" font-size="12">Clean and fill</text></g>
  <g><rect x="960" y="112" width="205" height="92" rx="13" fill="#c7ead3"/><text x="1062" y="150" fill="#173c2a" font-size="16" font-weight="700">Candidate regions</text><text x="1062" y="174" fill="#436b54" font-size="12">Labels and boxes</text></g>
</g>
<g stroke="#9ed7b4" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
<path d="M187 158 H215"/><path d="M372 158 H400"/><path d="M557 158 H585"/><path d="M742 158 H770"/><path d="M927 158 H955"/>
</g>
<text x="600" y="242" fill="#d5eadc" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Vegetation candidates only — not a verified crop-versus-weed classification</text>
</svg>