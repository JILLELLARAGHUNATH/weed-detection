name: Python preview quality checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/**"
      - "weed detection in crops/Code/sample images/**"
      - ".github/workflows/python-preview-checks.yml"
  push:
    branches:
      - docs/results-gallery-and-readme
    paths:
      - "tools/**"
      - "weed detection in crops/Code/sample images/**"
      - ".github/workflows/python-preview-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview-generator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip opencv-python-headless numpy

      - name: Check Python syntax
        run: python -m py_compile tools/generate_preview_gallery.py

      - name: Generate preview gallery
        run: python tools/generate_preview_gallery.py

      - name: Validate generated outputs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          results = Path("results")
          gallery = results / "gallery.jpg"
          summary = results / "processing_summary.csv"
          previews = results / "preview_images"

          assert gallery.is_file() and gallery.stat().st_size > 0, "Gallery missing or empty"
          assert summary.is_file() and summary.stat().st_size > 0, "CSV summary missing or empty"
          assert previews.is_dir(), "Preview directory missing"

          with summary.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          assert rows, "CSV contains no processed image rows"
          missing = [row["preview"] for row in rows if not (results / row["preview"]).is_file()]
          assert not missing, f"Missing preview images: {missing}"

          print(f"Validated {len(rows)} image rows and {len(rows)} preview files.")
          print(f"Gallery size: {gallery.stat().st_size} bytes")
          PY
